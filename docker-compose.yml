services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - OILTRACE_USE_SQLITE=1
      - OILTRACE_MODELS_DIR=/app/models
    ports:
      - "8000:8000"
    volumes:
      - oiltrace-data:/app/backend/data
      - oiltrace-artifacts:/app/backend/artifacts

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

